<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>داشبورد جامع ارزیابی استخدام</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--bg:#F4F6F8;--surface:#fff;--border:#E2E7ED;--ink:#1A2332;--inkSoft:#5B6472;
--primary:#0F6B5C;--primarySoft:#E5F1EE;--good:#0F7A4F;--warn:#B4791E;--bad:#B4444B;--gold:#C98A2C;--purple:#7A4FB5;}
*{box-sizing:border-box;font-family:'Vazirmatn',Tahoma,sans-serif;}
body{margin:0;background:var(--bg);color:var(--ink);padding:20px 22px 60px;}
h1{font-size:20px;font-weight:800;margin:0;}
.sub{font-size:12.5px;color:var(--inkSoft);margin:4px 0 0;}
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;}
.tab-btn{display:flex;align-items:center;gap:6px;padding:10px 14px;border:none;background:transparent;cursor:pointer;
font-size:13px;font-weight:500;color:var(--inkSoft);border-bottom:2.5px solid transparent;white-space:nowrap;}
.tab-btn.active{font-weight:700;color:var(--primary);border-bottom-color:var(--primary);}
main{max-width:1120px;margin:0 auto;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px;}
.card-title{font-size:14.5px;font-weight:700;margin-bottom:12px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
input,textarea,select{border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px;color:var(--ink);outline:none;background:#fff;}
textarea{width:100%;resize:vertical;}
.btn-primary{display:flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-ghost{display:flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border:1px solid var(--border);border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:600;cursor:pointer;}
.btn-danger{background:none;border:none;color:var(--bad);cursor:pointer;padding:4px;font-size:15px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.cand-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
.empty{padding:36px 10px;text-align:center;color:var(--inkSoft);font-size:13px;}
.star{cursor:pointer;font-size:19px;color:var(--border);}
.star.filled{color:var(--primary);}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:right;padding:8px 9px;color:var(--inkSoft);font-weight:700;border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:8px 9px;border-bottom:1px solid var(--border);white-space:nowrap;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border);cursor:pointer;background:#fff;color:var(--inkSoft);margin:0 4px 8px 0;}
.chip.active{background:var(--primarySoft);color:var(--primary);border-color:var(--primary);}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.bar-label{width:150px;font-size:12px;flex-shrink:0;}
.bar-track{flex:1;background:#EEF1F5;border-radius:6px;height:18px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;}
.bar-val{width:40px;font-size:12px;font-weight:700;color:var(--primary);}
.side-list-item{padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
.side-list-item.active{background:var(--primarySoft);color:var(--primary);font-weight:700;}
.hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--warn);margin-top:8px;}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;}
.badge.pending{background:#F1EEE5;color:var(--warn);}
.badge.accepted{background:#E3F3EA;color:var(--good);}
.badge.rejected{background:#F7E8E9;color:var(--bad);}
.stage-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.stage-tab{padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--inkSoft);}
.stage-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.sync-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;}
.sync-status{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;}
.sync-status.ok{background:#E3F3EA;color:var(--good);}
.sync-status.err{background:#F7E8E9;color:var(--bad);}
.sync-status.idle{background:#EEF1F5;color:var(--inkSoft);}
</style>
</head>
<body>
<header>
  <div>
    <h1>داشبورد جامع ارزیابی استخدام</h1>
    <div class="sub">چند موقعیت شغلی · سه مرحله ارزیابی · مقایسه نهایی توسط مدیر ارشد</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
    <button class="btn-ghost" onclick="exportCSV()">⬇ خروجی CSV</button>
  </div>
</header>

<div class="card" id="syncCard"></div>

<div class="tabs" id="tabs"></div>
<main id="main"></main>

<script>
const STORAGE_KEY = "eval-hub-v2";
const SHEET_URL_KEY = "eval-hub-sheet-url";
const uid = () => Math.random().toString(36).slice(2,10);
const clamp = (n,min,max)=>Math.min(max,Math.max(min,n));

const DEFAULT_STAGES = [
  {id:"stage1", title:"مرحله ۱ — غربالگری اولیه", weight:20, criteria:[
    {id:uid(),name:"تناسب رزومه با موقعیت شغلی",weight:25,desc:""},
    {id:uid(),name:"ارتباط کلامی و اعتماد‌به‌نفس",weight:20,desc:""},
    {id:uid(),name:"انگیزه و علاقه به موقعیت",weight:20,desc:""},
    {id:uid(),name:"تناسب انتظارات حقوق و شرایط",weight:15,desc:""},
    {id:uid(),name:"در دسترس بودن / زمان شروع",weight:10,desc:""},
    {id:uid(),name:"برداشت کلی مصاحبه‌کننده",weight:10,desc:""},
  ]},
  {id:"stage2", title:"مرحله ۲ — ارزیابی تخصصی", weight:40, criteria:[
    {id:uid(),name:"دانش فنی/تخصصی مرتبط با شغل",weight:25,desc:""},
    {id:uid(),name:"حل مسئله و تفکر تحلیلی",weight:20,desc:""},
    {id:uid(),name:"تجربه عملی و نمونه‌کار",weight:20,desc:""},
    {id:uid(),name:"مهارت ارتباط و کار تیمی",weight:15,desc:""},
    {id:uid(),name:"یادگیری‌پذیری و انطباق",weight:10,desc:""},
    {id:uid(),name:"دقت و کیفیت کار",weight:10,desc:""},
  ]},
  {id:"stage3", title:"مرحله ۳ — ارزیابی نهایی (مدیر ارشد)", weight:40, criteria:[
    {id:uid(),name:"تناسب فرهنگی با سازمان",weight:25,desc:""},
    {id:uid(),name:"پتانسیل رشد و رهبری",weight:20,desc:""},
    {id:uid(),name:"جمع‌بندی عملکرد در مراحل قبل",weight:20,desc:""},
    {id:uid(),name:"ارزش‌ها و اخلاق کاری",weight:20,desc:""},
    {id:uid(),name:"توصیه نهایی استخدام",weight:15,desc:""},
  ]},
];

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {positions:[], candidates:[], stages: DEFAULT_STAGES, evaluations:[]};
}
let data = loadData();
let tab = "positions";
let activeCandidateId = null;
let activeStageId = "stage1";
let compareIds = [];
let radarStageId = "stage1";
let dashboardPositionFilter = "all";
let evaluatorName = localStorage.getItem("eval-hub-evaluator") || "";
let syncStatus = "idle"; // idle | ok | err | syncing
let syncTimer = null;

function esc(s){ const d=document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function sheetUrl(){ return localStorage.getItem(SHEET_URL_KEY) || ""; }

function saveLocal(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
}
function scheduleSync(){
  saveLocal();
  if(!sheetUrl()) return;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(pushToSheet, 1200);
}
async function pushToSheet(){
  const url = sheetUrl();
  if(!url) return;
  syncStatus = "syncing"; renderSyncBox();
  try{
    const res = await fetch(url, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(data)
    });
    const json = await res.json();
    syncStatus = json && json.ok ? "ok" : "err";
  }catch(e){ syncStatus = "err"; }
  renderSyncBox();
}
async function pullFromSheet(){
  const url = sheetUrl();
  if(!url) return;
  syncStatus = "syncing"; renderSyncBox();
  try{
    const res = await fetch(url);
    const json = await res.json();
    if(json && json.stages){
      data = json;
      saveLocal();
      syncStatus = "ok";
      render();
    } else { syncStatus = "err"; }
  }catch(e){ syncStatus = "err"; }
  renderSyncBox();
}
function saveSheetUrl(val){
  localStorage.setItem(SHEET_URL_KEY, val.trim());
  renderSyncBox();
}

function renderSyncBox(){
  const url = sheetUrl();
  const statusMap = {
    idle:{cls:"idle",text: url ? "متصل — هنوز همگام نشده" : "بدون اتصال (فقط ذخیره محلی)"},
    syncing:{cls:"idle",text:"در حال همگام‌سازی…"},
    ok:{cls:"ok",text:"همگام با گوگل‌شیت ✓"},
    err:{cls:"err",text:"خطا در اتصال به گوگل‌شیت"},
  };
  const st = statusMap[syncStatus];
  document.getElementById("syncCard").innerHTML = `
    <div class="sync-box">
      <b style="font-size:12.5px;">اتصال به گوگل‌شیت:</b>
      <input id="sheetUrlInput" style="flex:1;min-width:240px;" placeholder="لینک Web App گوگل اپس‌اسکریپت را اینجا بچسبانید"
        value="${esc(url)}" onchange="saveSheetUrl(this.value)">
      <button class="btn-ghost" onclick="pullFromSheet()">⬇ دریافت از شیت</button>
      <button class="btn-ghost" onclick="pushToSheet()">⬆ ارسال به شیت</button>
      <span class="sync-status ${st.cls}">${st.text}</span>
    </div>`;
}

function summaryForStage(stageId, candidateId){
  const stage = data.stages.find(s=>s.id===stageId);
  const evs = data.evaluations.filter(e=>e.candidateId===candidateId && e.stageId===stageId);
  const perCriterion = {};
  stage.criteria.forEach(c=>{
    const vals = evs.map(e=>e.scores[c.id]).filter(v=>v!==undefined && v!==null);
    perCriterion[c.id] = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  });
  const scored = stage.criteria.filter(c=>perCriterion[c.id]!==null);
  const wSum = scored.reduce((s,c)=>s+Number(c.weight||0),0);
  const avg = wSum>0 ? scored.reduce((s,c)=>s+perCriterion[c.id]*Number(c.weight||0),0)/wSum : null;
  return {perCriterion, avg, evaluatorCount: evs.length};
}

function overallSummary(){
  return data.candidates.map(cand=>{
    const stageResults = data.stages.map(s=>({stageId:s.id, weight:s.weight, ...summaryForStage(s.id, cand.id)}));
    const withData = stageResults.filter(s=>s.avg!==null);
    const wSum = withData.reduce((s,x)=>s+Number(x.weight||0),0);
    const overall = wSum>0 ? withData.reduce((s,x)=>s+x.avg*Number(x.weight||0),0)/wSum : null;
    const pos = data.positions.find(p=>p.id===cand.positionId);
    return {candidate:cand, position:pos, stageResults, overall};
  }).sort((a,b)=>(b.overall??-1)-(a.overall??-1));
}

// ---------------- TABS ----------------
function renderTabs(){
  const tabs = [
    {id:"positions", label:`موقعیت‌های شغلی (${data.positions.length})`},
    {id:"candidates", label:`کاندیداها (${data.candidates.length})`},
    {id:"score", label:"ثبت امتیاز"},
    {id:"criteria", label:"ملاک‌های هر مرحله"},
    {id:"dashboard", label:"داشبورد مقایسه"},
  ];
  document.getElementById("tabs").innerHTML = tabs.map(t=>
    `<button class="tab-btn ${tab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.label}</button>`
  ).join("");
}
function setTab(t){ tab=t; render(); }

// ---------------- POSITIONS ----------------
function renderPositions(){
  const rows = data.positions.length===0
    ? `<div class="empty">هنوز موقعیت شغلی‌ای اضافه نشده.</div>`
    : data.positions.map(p=>{
        const count = data.candidates.filter(c=>c.positionId===p.id).length;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">
          <div><b style="font-size:13.5px;">${esc(p.title)}</b> <span style="font-size:12px;color:var(--inkSoft);">— ${count} کاندیدا</span></div>
          <button class="btn-danger" onclick="removePosition('${p.id}')">🗑</button>
        </div>`;
      }).join("");
  return `<div class="card">
    <div class="card-title">افزودن موقعیت شغلی</div>
    <div class="row">
      <input id="newPosTitle" style="flex:1;min-width:220px;" placeholder="مثلاً: کارشناس پشتیبانی مشتری" onkeydown="if(event.key==='Enter')addPosition()">
      <button class="btn-primary" onclick="addPosition()">＋ افزودن</button>
    </div>
  </div>
  <div class="card">${rows}</div>`;
}
function addPosition(){
  const title = document.getElementById("newPosTitle").value.trim();
  if(!title) return;
  data.positions.push({id:uid(), title});
  scheduleSync(); render();
}
function removePosition(id){
  data.positions = data.positions.filter(p=>p.id!==id);
  data.candidates = data.candidates.map(c=> c.positionId===id ? {...c, positionId:null} : c);
  scheduleSync(); render();
}

// ---------------- CANDIDATES ----------------
function renderCandidates(){
  if(data.positions.length===0){
    return `<div class="empty">اول از تب «موقعیت‌های شغلی» حداقل یک موقعیت اضافه کنید.</div>`;
  }
  const posOptions = data.positions.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join("");
  const cards = data.candidates.length===0
    ? `<div class="empty">هنوز کاندیدایی اضافه نشده.</div>`
    : `<div class="grid">${data.candidates.map(c=>{
        const pos = data.positions.find(p=>p.id===c.positionId);
        const s = overallSummary().find(x=>x.candidate.id===c.id);
        return `<div class="cand-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <div style="font-weight:700;font-size:14.5px;">${esc(c.name)}</div>
              <div style="font-size:12px;color:var(--inkSoft);margin-top:2px;">${esc(pos?.title||"بدون موقعیت")}</div>
            </div>
            <button class="btn-danger" onclick="removeCandidate('${c.id}')">🗑</button>
          </div>
          <div style="margin-top:10px;"><span class="badge ${c.status}">${statusLabel(c.status)}</span></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
            <div style="font-size:11.5px;color:var(--inkSoft);">امتیاز کلی</div>
            <div style="font-weight:800;font-size:13.5px;color:var(--primary);">${s?.overall!=null?s.overall.toFixed(2):"—"}</div>
          </div>
          <button style="margin-top:10px;background:none;border:none;color:var(--primary);font-weight:700;font-size:12px;cursor:pointer;padding:0;" onclick="activeCandidateId='${c.id}';setTab('score')">ثبت / مشاهده امتیاز ←</button>
        </div>`;
      }).join("")}</div>`;
  return `<div class="card">
    <div class="card-title">افزودن کاندیدا</div>
    <div class="row">
      <input id="newCandName" style="flex:2 1 200px;" placeholder="نام کاندیدا">
      <select id="newCandPos" style="flex:1 1 180px;">${posOptions}</select>
      <button class="btn-primary" onclick="addCandidate()">＋ افزودن</button>
    </div>
  </div>
  <div style="margin-top:4px;">${cards}</div>`;
}
function statusLabel(s){ return s==="accepted"?"پذیرفته شده":s==="rejected"?"رد شده":"در انتظار تصمیم"; }
function addCandidate(){
  const name = document.getElementById("newCandName").value.trim();
  const positionId = document.getElementById("newCandPos").value;
  if(!name || !positionId) return;
  const cand = {id:uid(), name, positionId, status:"pending", createdAt:Date.now()};
  data.candidates.push(cand);
  activeCandidateId = cand.id;
  scheduleSync(); render();
}
function removeCandidate(id){
  data.candidates = data.candidates.filter(c=>c.id!==id);
  data.evaluations = data.evaluations.filter(e=>e.candidateId!==id);
  if(activeCandidateId===id) activeCandidateId=null;
  compareIds = compareIds.filter(x=>x!==id);
  scheduleSync(); render();
}
function setCandidateStatus(id, status){
  const c = data.candidates.find(c=>c.id===id); if(c) c.status = status;
  scheduleSync(); render();
}

// ---------------- SCORE ----------------
function onEvaluatorInput(v){ evaluatorName=v; localStorage.setItem("eval-hub-evaluator", v); }
function getMyEval(candidateId, stageId){
  return data.evaluations.find(e=>e.candidateId===candidateId && e.stageId===stageId && e.evaluatorName===evaluatorName.trim());
}
function ensureEval(candidateId, stageId){
  let ev = getMyEval(candidateId, stageId);
  if(!ev){
    ev = {id:uid(), candidateId, stageId, evaluatorName:evaluatorName.trim(), scores:{}, note:"", updatedAt:Date.now()};
    data.evaluations.push(ev);
  }
  return ev;
}
function setScore(candidateId, stageId, criterionId, value){
  if(!evaluatorName.trim()) return;
  const ev = ensureEval(candidateId, stageId);
  ev.scores[criterionId] = value;
  scheduleSync(); render();
}
function setNote(candidateId, stageId, note){
  if(!evaluatorName.trim()) return;
  const ev = ensureEval(candidateId, stageId);
  ev.note = note;
  scheduleSync();
}
function removeEvaluation(evalId){
  data.evaluations = data.evaluations.filter(e=>e.id!==evalId);
  scheduleSync(); render();
}
function setActiveStage(id){ activeStageId = id; render(); }

function renderScore(){
  if(data.candidates.length===0) return `<div class="empty">ابتدا یک کاندیدا اضافه کنید.</div>`;
  const stage = data.stages.find(s=>s.id===activeStageId);
  const stageTabsHTML = data.stages.map(s=>
    `<div class="stage-tab ${activeStageId===s.id?'active':''}" onclick="setActiveStage('${s.id}')">${esc(s.title)}</div>`
  ).join("");

  const sideList = data.candidates.map(c=>{
    const pos = data.positions.find(p=>p.id===c.positionId);
    return `<div class="side-list-item ${activeCandidateId===c.id?'active':''}" onclick="activeCandidateId='${c.id}';render()">
      <span>${esc(c.name)}</span><span style="font-size:10.5px;color:var(--inkSoft);">${esc(pos?.title?.slice(0,10)||"")}</span>
    </div>`;
  }).join("");

  const cand = data.candidates.find(c=>c.id===activeCandidateId);
  let rightPane = `<div class="empty">یک کاندیدا را از لیست کنار انتخاب کنید.</div>`;
  if(cand){
    const ev = getMyEval(cand.id, activeStageId);
    const criteriaRows = stage.criteria.map(c=>{
      const val = ev?.scores?.[c.id] ?? 0;
      const stars = [1,2,3,4,5].map(n=>
        `<span class="star ${n<=val?'filled':''}" onclick="setScore('${cand.id}','${activeStageId}','${c.id}',${n})">★</span>`
      ).join("");
      return `<div style="padding:10px 0;border-bottom:1px solid var(--border);">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
          <div style="font-weight:600;font-size:13px;">${esc(c.name)}</div>
          <div style="font-size:11px;color:var(--inkSoft);">وزن ${c.weight}٪</div>
        </div>
        <div>${stars}</div>
      </div>`;
    }).join("");

    const evs = data.evaluations.filter(e=>e.candidateId===cand.id && e.stageId===activeStageId);
    const evsHTML = evs.length ? `<div style="margin-top:16px;">
      <div style="font-size:12px;font-weight:700;margin-bottom:8px;">ارزیابی‌های ثبت‌شده در این مرحله</div>
      ${evs.map(e=>`<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);">
        <div><div style="font-weight:600;font-size:12.5px;">${esc(e.evaluatorName)}</div>
        ${e.note?`<div style="font-size:11.5px;color:var(--inkSoft);margin-top:2px;">${esc(e.note)}</div>`:""}</div>
        <button class="btn-danger" onclick="removeEvaluation('${e.id}')">🗑</button>
      </div>`).join("")}
    </div>` : "";

    const statusBlock = activeStageId==="stage3" ? `
      <div style="margin-top:16px;padding-top:14px;border-top:1px dashed var(--border);">
        <div style="font-size:12px;font-weight:700;margin-bottom:8px;">تصمیم نهایی مدیر ارشد</div>
        <select onchange="setCandidateStatus('${cand.id}', this.value)">
          <option value="pending" ${cand.status==="pending"?"selected":""}>در انتظار تصمیم</option>
          <option value="accepted" ${cand.status==="accepted"?"selected":""}>پذیرفته شده</option>
          <option value="rejected" ${cand.status==="rejected"?"selected":""}>رد شده</option>
        </select>
      </div>` : "";

    rightPane = `
      <div class="card-title">${esc(cand.name)}</div>
      ${criteriaRows}
      <div style="margin-top:12px;">
        <div style="font-size:12px;font-weight:600;margin-bottom:6px;">یادداشت</div>
        <textarea rows="3" placeholder="مشاهدات و جمع‌بندی…" ${!evaluatorName.trim()?"disabled":""} onchange="setNote('${cand.id}','${activeStageId}', this.value)">${esc(ev?.note||"")}</textarea>
      </div>
      ${statusBlock}
      ${evsHTML}
    `;
  }

  return `
  <div class="card">
    <div class="card-title">نام ارزیاب</div>
    <input id="evaluatorInput" style="width:100%;" placeholder="مثلاً: سارا احمدی" value="${esc(evaluatorName)}" oninput="onEvaluatorInput(this.value)">
    ${!evaluatorName.trim()?`<div class="hint">⚠ برای ثبت امتیاز، ابتدا نام خودتان را وارد کنید.</div>`:""}
  </div>
  <div class="stage-tabs">${stageTabsHTML}</div>
  <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;">
    <div class="card" style="flex:0 0 230px;padding:10px;max-height:520px;overflow:auto;">${sideList}</div>
    <div class="card" style="flex:1 1 420px;">${rightPane}</div>
  </div>`;
}

// ---------------- CRITERIA ----------------
function renderCriteria(){
  return data.stages.map(stage=>{
    const totalWeight = stage.criteria.reduce((s,c)=>s+Number(c.weight||0),0);
    const rows = stage.criteria.map(c=>`
      <div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;">
        <input style="flex:3 1 220px;" value="${esc(c.name)}" onchange="updateCriterion('${stage.id}','${c.id}','name',this.value)">
        <div style="display:flex;align-items:center;gap:6px;">
          <input type="number" min="0" max="100" style="width:64px;" value="${c.weight}" onchange="updateCriterionWeight('${stage.id}','${c.id}',this.value)">
          <span style="font-size:12px;color:var(--inkSoft);">٪</span>
        </div>
        <button class="btn-danger" onclick="removeCriterion('${stage.id}','${c.id}')">🗑</button>
      </div>`).join("");
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div class="card-title" style="margin-bottom:0;">${esc(stage.title)}</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:12px;color:var(--inkSoft);">وزن این مرحله در امتیاز کلی:</span>
          <input type="number" min="0" max="100" style="width:60px;" value="${stage.weight}" onchange="updateStageWeight('${stage.id}',this.value)">
          <span style="font-size:12px;color:var(--inkSoft);">٪</span>
        </div>
      </div>
      <div style="font-size:11.5px;font-weight:700;color:${totalWeight===100?"var(--good)":"var(--warn)"};margin:8px 0;">
        مجموع وزن ملاک‌های این مرحله: ${totalWeight}٪ ${totalWeight!==100?"(پیشنهاد: ۱۰۰٪)":""}
      </div>
      ${rows}
      <button class="btn-ghost" style="margin-top:12px;" onclick="addCriterion('${stage.id}')">＋ افزودن ملاک</button>
    </div>`;
  }).join("");
}
function updateCriterion(stageId, critId, field, value){
  const stage = data.stages.find(s=>s.id===stageId);
  const c = stage.criteria.find(c=>c.id===critId); if(c) c[field]=value;
  scheduleSync();
}
function updateCriterionWeight(stageId, critId, value){
  const stage = data.stages.find(s=>s.id===stageId);
  const c = stage.criteria.find(c=>c.id===critId); if(c) c.weight = clamp(Number(value)||0,0,100);
  scheduleSync(); render();
}
function updateStageWeight(stageId, value){
  const stage = data.stages.find(s=>s.id===stageId);
  stage.weight = clamp(Number(value)||0,0,100);
  scheduleSync(); render();
}
function addCriterion(stageId){
  const stage = data.stages.find(s=>s.id===stageId);
  stage.criteria.push({id:uid(), name:"ملاک جدید", weight:5, desc:""});
  scheduleSync(); render();
}
function removeCriterion(stageId, critId){
  const stage = data.stages.find(s=>s.id===stageId);
  stage.criteria = stage.criteria.filter(c=>c.id!==critId);
  data.evaluations.forEach(e=>{ if(e.stageId===stageId) delete e.scores[critId]; });
  scheduleSync(); render();
}

// ---------------- DASHBOARD ----------------
function setDashboardFilter(v){ dashboardPositionFilter = v; render(); }
function setRadarStage(id){ radarStageId = id; render(); }
function toggleCompare(id){
  if(compareIds.includes(id)) compareIds = compareIds.filter(x=>x!==id);
  else if(compareIds.length<3) compareIds = [...compareIds, id];
  render();
}
function renderDashboard(){
  if(data.candidates.length===0) return `<div class="empty">برای مشاهده داشبورد، ابتدا کاندیدا و امتیاز ثبت کنید.</div>`;
  let summary = overallSummary();
  const posFilterHTML = `<select onchange="setDashboardFilter(this.value)">
    <option value="all">همه موقعیت‌ها</option>
    ${data.positions.map(p=>`<option value="${p.id}" ${dashboardPositionFilter===p.id?"selected":""}>${esc(p.title)}</option>`).join("")}
  </select>`;
  if(dashboardPositionFilter!=="all"){
    summary = summary.filter(s=>s.candidate.positionId===dashboardPositionFilter);
  }
  if(summary.length===0) return `<div class="card">${posFilterHTML}</div><div class="empty">کاندیدایی برای این موقعیت ثبت نشده.</div>`;

  const barRows = summary.map((x,i)=>`
    <div class="bar-row">
      <div class="bar-label">${esc(x.candidate.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${((x.overall||0)/5*100)}%;background:${i===0&&x.overall?"var(--primary)":"#AEB9C4"};"></div></div>
      <div class="bar-val">${x.overall!=null?x.overall.toFixed(1):"—"}</div>
    </div>`).join("");

  const tableRows = summary.map((x,i)=>`
    <tr>
      <td>${i===0 && x.overall ? "👑" : i+1}</td>
      <td style="font-weight:700;">${esc(x.candidate.name)}</td>
      <td>${esc(x.position?.title||"—")}</td>
      ${x.stageResults.map(sr=>`<td>${sr.avg!=null?sr.avg.toFixed(1):"—"}</td>`).join("")}
      <td style="font-weight:800;color:var(--primary);">${x.overall!=null?x.overall.toFixed(2):"—"}</td>
      <td><span class="badge ${x.candidate.status}">${statusLabel(x.candidate.status)}</span></td>
    </tr>`).join("");

  const chips = summary.map(x=>{
    const active = compareIds.includes(x.candidate.id);
    return `<span class="chip ${active?'active':''}" onclick="toggleCompare('${x.candidate.id}')">${active?"✓ ":""}${esc(x.candidate.name)}</span>`;
  }).join("");

  const stageChoiceHTML = data.stages.map(s=>
    `<span class="chip ${radarStageId===s.id?'active':''}" onclick="setRadarStage('${s.id}')">${esc(s.title)}</span>`
  ).join("");

  let radarHTML = `<div class="empty">یک یا چند کاندیدا را برای مقایسه انتخاب کنید.</div>`;
  if(compareIds.length>0) radarHTML = buildRadarSVG();

  return `
  <div class="card">${posFilterHTML}</div>
  <div class="card">
    <div class="card-title">رتبه‌بندی نهایی (امتیاز وزن‌دار کل ۳ مرحله)</div>
    ${barRows}
  </div>
  <div class="card">
    <div class="card-title">جدول مقایسه‌ای</div>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>رتبه</th><th>کاندیدا</th><th>موقعیت</th>${data.stages.map(s=>`<th>${esc(s.title.split("—")[0].trim())}</th>`).join("")}<th>امتیاز کلی</th><th>وضعیت</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <div class="card-title">مقایسه نموداری (رادار) — تا ۳ کاندیدا</div>
    <div style="margin-bottom:6px;font-size:12px;color:var(--inkSoft);">مرحله برای مقایسه ملاک‌ها:</div>
    <div style="margin-bottom:10px;">${stageChoiceHTML}</div>
    <div style="margin-bottom:12px;">${chips}</div>
    ${radarHTML}
  </div>`;
}

function buildRadarSVG(){
  const stage = data.stages.find(s=>s.id===radarStageId);
  const colors = ["#0F6B5C","#C98A2C","#7A4FB5"];
  const n = stage.criteria.length;
  if(n===0) return `<div class="empty">این مرحله ملاکی ندارد.</div>`;
  const cx=250, cy=220, r=170;
  const angleFor = i => (Math.PI*2*i/n) - Math.PI/2;
  const point = (i, val) => {
    const a = angleFor(i);
    const rad = (val/5)*r;
    return [cx + rad*Math.cos(a), cy + rad*Math.sin(a)];
  };
  let gridRings = "";
  [1,2,3,4,5].forEach(step=>{
    const pts = stage.criteria.map((c,i)=>point(i, step).join(",")).join(" ");
    gridRings += `<polygon points="${pts}" fill="none" stroke="#E2E7ED" stroke-width="1"/>`;
  });
  let axes = "", labels = "";
  stage.criteria.forEach((c,i)=>{
    const [x,y] = point(i,5.4);
    axes += `<line x1="${cx}" y1="${cy}" x2="${point(i,5)[0]}" y2="${point(i,5)[1]}" stroke="#E2E7ED"/>`;
    labels += `<text x="${x}" y="${y}" font-size="10" fill="#5B6472" text-anchor="middle">${esc(c.name).slice(0,14)}</text>`;
  });
  let polys = "", legend = "";
  compareIds.forEach((cid,idx)=>{
    const cand = data.candidates.find(c=>c.id===cid);
    if(!cand) return;
    const sr = summaryForStage(radarStageId, cid);
    const pts = stage.criteria.map((c,i)=>point(i, sr.perCriterion[c.id]||0).join(",")).join(" ");
    polys += `<polygon points="${pts}" fill="${colors[idx]}22" stroke="${colors[idx]}" stroke-width="2"/>`;
    legend += `<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-left:14px;">
      <span style="width:10px;height:10px;background:${colors[idx]};border-radius:2px;display:inline-block;"></span>${esc(cand.name)}
    </div>`;
  });
  return `<div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;">${legend}</div>
  <svg viewBox="0 0 500 440" style="width:100%;max-width:560px;">${gridRings}${axes}${polys}${labels}</svg>`;
}

function exportCSV(){
  const header = ["کاندیدا","موقعیت","مرحله","ارزیاب","امتیازها(JSON)","یادداشت"];
  const rows = [header];
  data.evaluations.forEach(e=>{
    const cand = data.candidates.find(c=>c.id===e.candidateId);
    const pos = cand ? data.positions.find(p=>p.id===cand.positionId) : null;
    const stage = data.stages.find(s=>s.id===e.stageId);
    rows.push([cand?.name||"", pos?.title||"", stage?.title||"", e.evaluatorName, JSON.stringify(e.scores), e.note||""]);
  });
  const csv = rows.map(r=>r.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "ارزیابی-استخدام.csv"; a.click();
  URL.revokeObjectURL(url);
}

// ---------------- MAIN RENDER (with focus preservation) ----------------
function render(){
  const active = document.activeElement;
  let savedId=null, savedStart=null, savedEnd=null;
  if(active && (active.tagName==="INPUT"||active.tagName==="TEXTAREA") && active.id){
    savedId = active.id;
    try{ savedStart = active.selectionStart; savedEnd = active.selectionEnd; }catch(e){}
  }

  renderSyncBox();
  renderTabs();
  const main = document.getElementById("main");
  if(tab==="positions") main.innerHTML = renderPositions();
  else if(tab==="candidates") main.innerHTML = renderCandidates();
  else if(tab==="score") main.innerHTML = renderScore();
  else if(tab==="criteria") main.innerHTML = renderCriteria();
  else if(tab==="dashboard") main.innerHTML = renderDashboard();

  if(savedId){
    const el = document.getElementById(savedId);
    if(el){
      el.focus();
      if(savedStart!=null){ try{ el.setSelectionRange(savedStart, savedEnd); }catch(e){} }
    }
  }
}

render();
if(sheetUrl()) pullFromSheet();
</script>
